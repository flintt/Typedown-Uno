name: "功能建议 / Feature request"
description: "希望增加或改进的功能 / Something you'd like added or changed"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **本仓库的 issue 由 AI（Claude Code）负责评估和实现，维护者只做验收。**
        > 请把"要解决的问题"和"期望的效果"写具体：在哪个界面、什么操作、结果是什么样；
        > 如果 Windows 原生版（flintt/Typedown）已经有这个功能，直接说明即可，会照着它来做。
        >
        > **Feature requests here are evaluated and implemented by an AI (Claude Code); the maintainer only reviews.**
        > Be concrete about where the feature lives, how it is used and what the result looks like. If the Windows
        > edition (flintt/Typedown) already has it, say so — it will be matched to that behaviour.

  - type: textarea
    id: problem
    attributes:
      label: "想解决什么问题 / Problem"
      description: "现在哪里不方便、绕不过去 / What is awkward or impossible today"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "期望的功能 / Proposed behaviour"
      description: "具体怎么操作、在哪个菜单/设置里、效果是什么 / How it would work: menu, setting, result"
    validations:
      required: true

  - type: dropdown
    id: parity
    attributes:
      label: "Windows 原生版是否已有 / Does the Windows edition have it?"
      options:
        - "有，希望这里保持一致 / Yes — please match it"
        - "没有，这是新功能 / No, this is new"
        - "不清楚 / Not sure"

  - type: dropdown
    id: area
    attributes:
      label: "涉及的部分 / Area"
      multiple: true
      options:
        - "编辑器 / Editor"
        - "多标签与多窗口 / Tabs & windows"
        - "文件树与侧栏 / File tree & side pane"
        - "导出与分享 (HTML/HedgeDoc) / Export & share"
        - "外观与主题 / Appearance & themes"
        - "快捷键 / Shortcuts"
        - "设置 / Settings"
        - "打包与安装 (deb/AppImage/tar.gz) / Packaging & install"
        - "其他 / Other"

  - type: dropdown
    id: platform
    attributes:
      label: "主要使用的平台 / Platform you use"
      multiple: true
      options:
        - "Linux"
        - "Windows"
        - "macOS"

  - type: textarea
    id: alternatives
    attributes:
      label: "现在的替代做法 / Workarounds tried"
      description: "有没有别的编辑器是这么做的，可以附截图 / Other editors that do this, screenshots welcome"
